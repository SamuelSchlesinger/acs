[package]
name = "acs"
version = "0.1.0"
edition = "2024"

[dependencies]
anonymous-credit-tokens = { git = "https://github.com/SamuelSchlesinger/anonymous-credit-tokens" }
nullifierdb = { git = "https://github.com/SamuelSchlesinger/nullifierdb" }
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
log = "0.4.21"
env_logger = "0.11.2"
actix-web = { version = "4.5.1", features = ["rustls-0_20"] }
actix-rt = "2.9.0"
bytes = "1.5.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
blake3 = "1.8.2"
rustls = "0.20.9"
rustls-pemfile = "1.0.4"
rcgen = "0.12.1"
