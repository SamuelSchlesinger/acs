[package]
name = "acs"
version = "0.1.0"
edition = "2024"

# Define the library and binary targets
[lib]
path = "src/lib.rs"

[[bin]]
name = "acs"
path = "src/main.rs"

[[bin]]
name = "acs-cli"
path = "src/cli.rs"

[dependencies]
anonymous-credit-tokens = { git = "https://github.com/SamuelSchlesinger/anonymous-credit-tokens" }
nullifierdb = { git = "https://github.com/SamuelSchlesinger/nullifierdb" }
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
log = "0.4.21"
env_logger = "0.11.2"
actix-web = { version = "4.5.1", features = ["rustls-0_20"] }
actix-rt = "2.9.0"
bytes = "1.5.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand_chacha = "0.3.1"
num_cpus = "1.16.0"
blake3 = "1.8.2"
rustls = "0.20.9"
rustls-pemfile = "1.0.4"
rcgen = "0.12.1"
# Added dependencies for client implementation
reqwest = { version = "0.11", features = ["rustls-tls", "json"] }
thiserror = "1.0"
tokio = { version = "1.34", features = ["full"] }
# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
rusqlite = { version = "0.30.0", features = ["bundled"] }
toml = "0.8.10"
dirs = "5.0.1"
hex = "0.4.3"
dialoguer = "0.11.0"
indicatif = "0.17.7"
console = "0.15.8"
curve25519-dalek = "4.1.3"
tempfile = "3.10.1"

[dev-dependencies]
tokio-test = "0.4.2"
